<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kick VOD Resume</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="app">
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button id="tab-settings" class="tab" type="button" role="tab" data-tab="settings"
              aria-controls="panel-settings" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h9M17 7h3M4 17h3M11 17h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="15" cy="7" r="2.3" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="9" cy="17" r="2.3" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span>Settings</span>
      </button>
      <button id="tab-kick-records" class="tab" type="button" role="tab" data-tab="kick-records"
              aria-controls="panel-kick-records" aria-selected="false" tabindex="-1">
        <img src="icons/kick.svg" alt="" width="16" height="16">
        <span>Kick</span>
      </button>
      <button id="tab-youtube-records" class="tab" type="button" role="tab" data-tab="youtube-records"
              aria-controls="panel-youtube-records" aria-selected="false" tabindex="-1">
        <img src="icons/youtube.svg" alt="" width="16" height="16">
        <span>YouTube</span>
      </button>
    </nav>

    <!-- Panels start hidden; popup-ui.js shows the one that was open last time. -->
    <section id="panel-settings" class="tab-panel" role="tabpanel" aria-labelledby="tab-settings" data-panel="settings" hidden>
      <section class="setting-group" aria-labelledby="group-x">
        <header class="group-header">
          <img class="group-icon" src="icons/x.svg" alt="" width="28" height="28">
          <h2 id="group-x">X</h2>
          <span class="group-sub">x.com &middot; twitter.com</span>
        </header>
        <div class="setting-card">
          <label class="setting-row">
            <span id="name-xMaxQuality" class="setting-name">Max video quality</span>
            <svg class="info-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <circle cx="12" cy="7.9" r="1.15" fill="currentColor"/>
            </svg>
            <span class="switch">
              <input type="checkbox" role="switch" data-setting="xMaxQuality"
                     aria-labelledby="name-xMaxQuality" aria-describedby="tip-xMaxQuality">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
            <span id="tip-xMaxQuality" class="tooltip" role="tooltip">
              Always plays X videos in the highest quality available instead of letting X
              auto-switch to lower ones. Uses more data and may buffer on slow connections.
            </span>
          </label>
        </div>
      </section>

      <section class="setting-group" aria-labelledby="group-kick">
        <header class="group-header">
          <img class="group-icon" src="icons/kick.svg" alt="" width="28" height="28">
          <h2 id="group-kick">Kick</h2>
          <span class="group-sub">kick.com</span>
        </header>
        <div class="setting-card">
          <label class="setting-row">
            <span id="name-kickBestQuality" class="setting-name">Best quality for new VODs</span>
            <svg class="info-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <circle cx="12" cy="7.9" r="1.15" fill="currentColor"/>
            </svg>
            <span class="switch">
              <input type="checkbox" role="switch" data-setting="kickBestQuality"
                     aria-labelledby="name-kickBestQuality" aria-describedby="tip-kickBestQuality">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
            <span id="tip-kickBestQuality" class="tooltip" role="tooltip">
              When you open a VOD you haven't watched before, picks its highest quality
              automatically. VODs that already have a saved quality keep that choice.
            </span>
          </label>
          <label class="setting-row">
            <span id="name-kickLiveQuality" class="setting-name">Best quality for live streams</span>
            <svg class="info-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <circle cx="12" cy="7.9" r="1.15" fill="currentColor"/>
            </svg>
            <span class="switch">
              <input type="checkbox" role="switch" data-setting="kickLiveQuality"
                     aria-labelledby="name-kickLiveQuality" aria-describedby="tip-kickLiveQuality">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
            <span id="tip-kickLiveQuality" class="tooltip" role="tooltip">
              When you open a channel that is live, picks the highest quality available instead of Kick's default.
            </span>
          </label>
          <label class="setting-row">
            <span id="name-kickDisableChat" class="setting-name">Disable chat</span>
            <svg class="info-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <circle cx="12" cy="7.9" r="1.15" fill="currentColor"/>
            </svg>
            <span class="switch">
              <input type="checkbox" role="switch" data-setting="kickDisableChat"
                     aria-labelledby="name-kickDisableChat" aria-describedby="tip-kickDisableChat">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
            <span id="tip-kickDisableChat" class="tooltip" role="tooltip">
              Hides the chat on live streams and VODs, so the video fills the page and the browser stops drawing messages. That saves CPU and battery. Off by default, so chat shows as normal.
            </span>
          </label>
        </div>
      </section>

      <section class="setting-group" aria-labelledby="group-youtube">
        <header class="group-header">
          <img class="group-icon" src="icons/youtube.svg" alt="" width="28" height="28">
          <h2 id="group-youtube">YouTube</h2>
          <span class="group-sub">youtube.com</span>
        </header>
        <div class="setting-card">
          <label class="setting-row">
            <span id="name-youtubeMaxHeight" class="setting-name">Best quality up to</span>
            <svg class="info-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <circle cx="12" cy="7.9" r="1.15" fill="currentColor"/>
            </svg>
            <select class="setting-select" data-setting="youtubeMaxHeight"
                    aria-labelledby="name-youtubeMaxHeight" aria-describedby="tip-youtubeMaxHeight"></select>
            <span id="tip-youtubeMaxHeight" class="tooltip" role="tooltip">
              Plays videos and live streams in the highest quality that doesn't go above the one you pick, instead of letting YouTube auto-switch. If a video tops out lower, you get its best. Off leaves YouTube's automatic quality alone. 1440p and up use a lot of data and may buffer.
            </span>
          </label>
          <label class="setting-row">
            <span id="name-youtubeResume" class="setting-name">Remember position</span>
            <svg class="info-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <circle cx="12" cy="7.9" r="1.15" fill="currentColor"/>
            </svg>
            <span class="switch">
              <input type="checkbox" role="switch" data-setting="youtubeResume"
                     aria-labelledby="name-youtubeResume" aria-describedby="tip-youtubeResume">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
            <span id="tip-youtubeResume" class="tooltip" role="tooltip">
              Remembers where you stopped each YouTube video and jumps back there next time. Not used for live streams, Shorts or links that already have a timestamp.
            </span>
          </label>
          <label class="setting-row">
            <span id="name-youtubeDisableChat" class="setting-name">Disable chat</span>
            <svg class="info-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <circle cx="12" cy="7.9" r="1.15" fill="currentColor"/>
            </svg>
            <span class="switch">
              <input type="checkbox" role="switch" data-setting="youtubeDisableChat"
                     aria-labelledby="name-youtubeDisableChat" aria-describedby="tip-youtubeDisableChat">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
            <span id="tip-youtubeDisableChat" class="tooltip" role="tooltip">
              Hides the chat on live streams and chat replays, and stops it from loading at all (from the next video you open), so nothing is downloaded or drawn for it. Off by default, so chat shows as normal.
            </span>
          </label>
        </div>
      </section>

      <section class="setting-group" aria-labelledby="group-twitch">
        <header class="group-header">
          <img class="group-icon" src="icons/twitch.svg" alt="" width="28" height="28">
          <h2 id="group-twitch">Twitch</h2>
          <span class="group-sub">twitch.tv</span>
        </header>
        <div class="setting-card">
          <label class="setting-row">
            <span id="name-twitchQuality" class="setting-name">Best quality</span>
            <svg class="info-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <circle cx="12" cy="7.9" r="1.15" fill="currentColor"/>
            </svg>
            <span class="switch">
              <input type="checkbox" role="switch" data-setting="twitchQuality"
                     aria-labelledby="name-twitchQuality" aria-describedby="tip-twitchQuality">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
            <span id="tip-twitchQuality" class="tooltip" role="tooltip">
              Opens Twitch streams and videos in Source quality, the highest the streamer offers, instead of Auto. Uses more data and may buffer on slow connections.
            </span>
          </label>
          <label class="setting-row">
            <span id="name-twitchDisableChat" class="setting-name">Disable chat</span>
            <svg class="info-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 11v5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <circle cx="12" cy="7.9" r="1.15" fill="currentColor"/>
            </svg>
            <span class="switch">
              <input type="checkbox" role="switch" data-setting="twitchDisableChat"
                     aria-labelledby="name-twitchDisableChat" aria-describedby="tip-twitchDisableChat">
              <span class="switch-track" aria-hidden="true"></span>
            </span>
            <span id="tip-twitchDisableChat" class="tooltip" role="tooltip">
              Hides the chat on live streams and VODs, so the browser stops drawing messages. That saves CPU and battery. Off by default, so chat shows as normal.
            </span>
          </label>
        </div>
      </section>

      <p class="settings-hint">Changes apply to the next video you open.</p>
    </section>

    <section id="panel-kick-records" class="tab-panel" role="tabpanel" aria-labelledby="tab-kick-records" data-panel="kick-records" hidden>
      <header class="header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M5 3h6v6h2V5h6v6h-6v2h6v6h-6v-4h-2v6H5V3Z" fill="currentColor"/>
          </svg>
        </div>
        <div class="heading">
          <h1>Kick VODs</h1>
          <p>Your saved playback progress</p>
        </div>
        <button class="icon-button" type="button" data-role="refresh" title="Refresh list" aria-label="Refresh list">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.6 9a7 7 0 0 1 11.7-2L20 12M4 12l2.7 5a7 7 0 0 0 11.7-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <section class="toolbar" aria-label="Saved VODs controls">
        <label class="select-all">
          <input type="checkbox" data-role="select-all">
          <span>Select all</span>
        </label>
        <div class="toolbar-actions">
          <span class="item-count" data-role="count">0 VODs</span>
          <button class="delete-button" type="button" data-role="delete" disabled>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Delete selected
          </button>
        </div>
      </section>

      <section class="video-list" data-role="list" aria-live="polite"></section>
    </section>

    <section id="panel-youtube-records" class="tab-panel" role="tabpanel" aria-labelledby="tab-youtube-records" data-panel="youtube-records" hidden>
      <header class="header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="2" y="5" width="20" height="14" rx="4.2" fill="#FF0000"/>
            <path d="M9.8 8.6v6.8l5.8-3.4Z" fill="#ffffff"/>
          </svg>
        </div>
        <div class="heading">
          <h1>YouTube videos</h1>
          <p>Your saved playback progress</p>
        </div>
        <button class="icon-button" type="button" data-role="refresh" title="Refresh list" aria-label="Refresh list">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M5.6 9a7 7 0 0 1 11.7-2L20 12M4 12l2.7 5a7 7 0 0 0 11.7-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <section class="toolbar" aria-label="Saved videos controls">
        <label class="select-all">
          <input type="checkbox" data-role="select-all">
          <span>Select all</span>
        </label>
        <div class="toolbar-actions">
          <span class="item-count" data-role="count">0 videos</span>
          <button class="delete-button" type="button" data-role="delete" disabled>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Delete selected
          </button>
        </div>
      </section>

      <section class="video-list" data-role="list" aria-live="polite"></section>
    </section>

    <footer class="footer">
      <span class="privacy-dot" aria-hidden="true"></span>
      Saved only in this browser
    </footer>
    <p id="appVersion" class="app-version"></p>
  </main>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
  <script src="popup-ui.js"></script>
</body>
</html>
